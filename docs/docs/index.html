<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Home</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="DWC UI">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/pure.css">
  <script type="module" src="//cdn.webforj.com/next/dwc-ui.esm.js"></script>
  <script nomodule src="//cdn.webforj.com/next/dwc-ui.js"></script>

  <link rel="stylesheet" href="//cdn.webforj.com/next/dwc-ui.css" />
  <link rel="stylesheet" href="docsify/theme.css" />
  <link rel="stylesheet" href="docsify/theme-toggle/theme-toggle.css" />
  <link rel="stylesheet" href="docsify/version-selector/version-selector.css" />
  <link rel="stylesheet" href="docsify/code-block.css" />
  <link rel="stylesheet" href="docsify/doc-components/doc-components.css" />
  <style>

    .cover {
      background-color: #263238 !important;
      background: url(_media/pattern.png) !important;
      background-size: 100% 100% !important;
      background-repeat: no-repeat !important;
    }

    .app-name-link img {
      width: 75px;
      height: auto;
      margin-top: 20px;
    }

  </style>
</head>

<body>
  <div id="app"></div>
  <script>
    if (!window.location.hash || window.location.hash === '#/') {
      window.location.hash = '#/dwc/';
    }
  </script>
  <script>
    window.$docsify = {
      coverpage: false,
      themeColor: 'var(--dwc-color-primary)',
      name: 'DWC',
      repo: '',
      logo: '/_media/logo.png',
      loadSidebar: true,
      subMaxLevel: 2,
      search: 'auto',
      auto2top: true,
      customPageTitle: {
        prefix: 'DWC',
        suffix: false,
        seprator: '|',
      },
      tabs: {
        theme: 'material',
      },
      plugins: [
        function (hook) {
          var year = new Date().getFullYear();
          hook.beforeEach(function (content) {
            if (/BASIS International Ltd/.test(content)) return content;
            return content + '\n\n----------------------------------------------\n*Built by [BASIS International Ltd](https://www.basis.cloud/). Al rights reserved ' + year + '.*';
          });
        },
      ],
    }

  </script>
  <!-- Docsify v4 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-tabs@1"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bbj.min.js"></script>
  <script src="docsify/theme-toggle/theme-toggle.js"></script>
  <script src="docsify/version-selector/version-selector.js"></script>
  <script src="docsify/doc-components/doc-components.js"></script>
  <script src="//cdn.jsdelivr.net/gh/webforj/dwc-docsify@0.0.4/plugins/code-block/code-block.min.js"></script>
  <script src="//unpkg.com/docsify-copy-code@2"></script>
  <script src="//cdn.jsdelivr.net/npm/@sujaykumarh/docsify-plugin-title@1.x/dist/plugin.min.js"></script>
</body>

</html>
